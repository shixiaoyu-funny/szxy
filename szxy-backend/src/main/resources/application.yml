server:
  port: 8099

spring:
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  ai:
    openai:
      api-key: ${ai.apikey}
      # 勿在 base-url 末尾加 /v1，Spring AI 默认 completions-path=/v1/chat/completions
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.7-flash
      embedding:
        options:
          model: qwen3.7-text-embedding
  datasource:
    url: ${mysql.url}
    username: ${mysql.username}
    password: ${mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${redis.url}
      port: ${redis.port}
      password: ${redis.password}
  mail:
    host: ${mail.host}
    username: ${mail.username}
    password: ${mail.password}
    port: 587
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
  rabbitmq:
    username: ${rabbitmq.username}
    password: ${rabbitmq.password}
    host: ${rabbitmq.host}
    port: ${rabbitmq.port}
    listener:
      simple:
        prefetch: 10
        acknowledge-mode: auto
        retry:
          enabled: true
          multiplier: 1
          max-attempts: 3
          initial-interval: 1000ms
          stateless: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.shixiaoyu.xiangyueproject.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
  type-aliases-package: com.shixiaoyu.xiangyueproject.entity.po
  mapper-locations: "classpath*:/mapper/**/*.xml"

auth:
  # 无需登录即可访问的路径（登录注册、Swagger 文档等）
  exclude-path:
    - /lg/sdcode
    - /lg/ph
    - /lg/em
    - /lg/pw
    - /doc.html
    - /webjars/**
    - /v3/api-docs/**
    - /swagger-ui.html
    - /swagger-ui/**
    - /favicon.ico
    - /error
  # 需要管理端权限（role=4）的路径，由 AdminInterceptor 统一拦截
  admin-path:
    - /report/**
    - /sys/**

aliyun:
  accessKeyId: ${aliyun.key-id}
  accessKeySecret: ${aliyun.secret}
  regionId: ${aliyun.regionId}
  endpoint: ${aliyun.endpoint}
  bucketName: ${aliyun.bucketName}

ai-websearch:
  apikey: ${web-search.apikey}
  base-url: https://api.bochaai.com/v1/web-search
  count: 10
  summary: true
  freshness: noLimit
  connect-timeout: 10s
  read-timeout: 15s