# =====================================================================
# 「数智乡约」本地/正式环境中间件编排文件
# 包含：MySQL / Redis / RabbitMQ
# 全部使用「命名数据卷」挂载（数据卷挂载，非宿主机目录挂载）
# 迁移到正式虚拟机：将本文件复制过去后执行
#     docker compose up -d
# 首次启动自动创建 mysql-data/mysql-conf/mysql-logs/redis-data/redis-conf/
# redis-logs/rabbitmq-data/rabbitmq-conf/rabbitmq-logs 等命名卷
#
# 端口与账号约定：
#   MySQL   : 宿主机 3399 -> 容器 3306   | root / 200609
#   Redis   : 宿主机 6399 -> 容器 6379   | 密码 200609
#   RabbitMQ: 宿主机 5673 -> 容器 5672(AMQP)
#             宿主机 15673 -> 容器 15672(管理控制台) | root / 200609
#             管理台地址 http://宿主机IP:15673
# =====================================================================

# 项目名：所有命名卷/网络统一加 xiangyue_ 前缀（如 xiangyue_mysql-data）
# 网络单独命名为 xy-network，便于后续与后端/前端容器互通
name: xiangyue

networks:
  xy-network:
    name: xy-network
    driver: bridge

services:
  mysql:
    image: mysql:8.0.41
    container_name: xiangyue-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "200609"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3399:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-conf:/etc/mysql/conf.d
      - mysql-logs:/var/log/mysql
    networks:
      - xy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p200609"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: xiangyue-redis
    restart: always
    # 日志输出到 stdout，用 docker logs xiangyue-redis 查看；
    # redis-logs 卷为后续开启 logfile 预留（镜像内 /var/log/redis 不存在，
    # 命名卷首次创建时默认 root 属主，如需 logfile 需先对卷执行
    #   docker run --rm -v <项目前缀>_redis-logs:/var/log/redis redis:7.4 chown redis:redis /var/log/redis
    # 挂载 conf 配置同理）
    command:
      - redis-server
      - --requirepass
      - "200609"
      - --appendonly
      - yes
      - --dir
      - /data
    ports:
      - "6399:6379"
    volumes:
      - redis-data:/data
      - redis-conf:/usr/local/etc/redis
      - redis-logs:/var/log/redis
    networks:
      - xy-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "200609", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: xiangyue-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: "root"
      RABBITMQ_DEFAULT_PASS: "200609"
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-conf:/etc/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    networks:
      - xy-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  mysql-data:
    name: xiangyue_mysql-data
  mysql-conf:
    name: xiangyue_mysql-conf
  mysql-logs:
    name: xiangyue_mysql-logs
  redis-data:
    name: xiangyue_redis-data
  redis-conf:
    name: xiangyue_redis-conf
  redis-logs:
    name: xiangyue_redis-logs
  rabbitmq-data:
    name: xiangyue_rabbitmq-data
  rabbitmq-conf:
    name: xiangyue_rabbitmq-conf
  rabbitmq-logs:
    name: xiangyue_rabbitmq-logs
